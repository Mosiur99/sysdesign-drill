services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: drill
      POSTGRES_USER: drill
      POSTGRES_PASSWORD: drill
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drill -d drill"]
      interval: 5s
      retries: 10

  app:
    profiles: [app]
    build: .
    image: sysdesign-drill:local
    restart: unless-stopped
    env_file: .env
    environment:
      DRILL_DB_URL: jdbc:postgresql://postgres:5432/drill
      DRILL_FORWARD_HEADERS: native
      DRILL_SECURE_COOKIE: "true"
      DRILL_TUNNEL_METRICS_URL: http://tunnel:2000
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy

  tunnel:
    profiles: [app]
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:8080
    depends_on:
      - app

volumes:
  pgdata:
