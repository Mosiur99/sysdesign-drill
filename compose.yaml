services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drill
      POSTGRES_USER: drill
      POSTGRES_PASSWORD: drill
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drill -d drill"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
