spring:
  application:
    name: sysdesign-drill
  datasource:
    url: ${DRILL_DB_URL:jdbc:postgresql://localhost:5434/drill}
    username: ${DRILL_DB_USER:drill}
    password: ${DRILL_DB_PASSWORD:drill}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

drill:
  zone: ${DRILL_ZONE:Asia/Dhaka}
  problems:
    location: classpath:problems/*.yaml
  pick:
    cron: ${DRILL_PICK_CRON:0 0 8 * * *}
  grading:
    sweep-interval: PT1M
  llm:
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    reasoning-effort: ${GROQ_REASONING_EFFORT:low}
    connect-timeout: 5s
    read-timeout: 90s
    max-retry-after: 30s
    max-attempts: 3
  telegram:
    base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    app-url: ${DRILL_APP_URL:http://localhost:8080}
    tunnel-metrics-url: ${DRILL_TUNNEL_METRICS_URL:}
    timeout: 10s
  notify:
    daily-cron: ${DRILL_NOTIFY_DAILY_CRON:0 5 8 * * *}
    reminder-cron: ${DRILL_NOTIFY_REMINDER_CRON:0 0 21 * * *}
    weekly-cron: ${DRILL_NOTIFY_WEEKLY_CRON:0 0 20 * * SUN}
    send-interval: PT15S
  auth:
    username: ${DRILL_USER:}
    password-hash: ${DRILL_PASSWORD_HASH:}

server:
  forward-headers-strategy: ${DRILL_FORWARD_HEADERS:none}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${DRILL_SECURE_COOKIE:false}

logging:
  level:
    org.springframework.web.client: WARN

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when-authorized
