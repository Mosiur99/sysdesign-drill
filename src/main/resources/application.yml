spring:
  application:
    name: sysdesign-drill
  datasource:
    url: ${DRILL_DB_URL:jdbc:postgresql://localhost:5434/drill}
    username: ${DRILL_DB_USER:drill}
    password: ${DRILL_DB_PASSWORD:drill}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

drill:
  zone: ${DRILL_ZONE:Asia/Dhaka}
  problems:
    location: classpath:problems/*.yaml
  pick:
    cron: ${DRILL_PICK_CRON:0 0 8 * * *}
  auth:
    username: ${DRILL_USER:}
    password-hash: ${DRILL_PASSWORD_HASH:}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${DRILL_SECURE_COOKIE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
